name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/gramps_mcp --ignore-missing-imports

      - name: Run offline tests with coverage
        env:
          GRAMPS_API_URL: "https://gramps.example.com"
          GRAMPS_USERNAME: "ci"
          GRAMPS_PASSWORD: "ci"
          GRAMPS_TREE_ID: "ci"
        # The marker filter alone keeps this run offline: verified by running
        # the same selection against an unreachable API URL, where all 229
        # tests still pass. Naming the directory rather than an allowlist
        # means a new offline test file is covered without editing CI - the
        # allowlist had already fallen behind by two files.
        run: uv run pytest -m "not integration" --cov=src/gramps_mcp --cov-report=xml tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
