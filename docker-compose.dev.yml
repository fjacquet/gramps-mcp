services:
  gramps-mcp:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /Users/fjacquet/Downloads:/Users/fjacquet/Downloads:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s